<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iPhone Demo Loop</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video autoplay muted loop playsinline>
    <source src="iphone_ad.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <script>
    let idleTime = 0;
    const resetTimer = () => {
      idleTime = 0;
    };

    // Count idle time
    setInterval(() => {
      idleTime++;
      if (idleTime >= 30) {
        window.location.reload(); // Reloads to restart video
      }
    }, 1000);

    // Reset timer on interaction
    ['click', 'mousemove', 'keydown', 'touchstart'].forEach(event =>
      document.addEventListener(event, resetTimer)
    );
  </script>
</body>
</html>
